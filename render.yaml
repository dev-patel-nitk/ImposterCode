services:
  - type: web
    name: impostercode-backend
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: impostercode-db
          property: connectionString
      - key: PG_CONNECTION_STRING
        fromDatabase:
          name: impostercode-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: JDOODLE_CLIENT_ID_1
        sync: false
      - key: JDOODLE_CLIENT_SECRET_1
        sync: false

databases:
  - name: impostercode-db
    databaseName: impostercode
    user: impostercode_user
